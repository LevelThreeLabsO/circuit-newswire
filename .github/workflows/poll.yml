name: newswire

on:
  # Pinged every ~15 min by cron-job.org via the workflow_dispatch API, the same pattern
  # as the article watchers. GitHub's own schedule below is a laggy fallback: it drifts
  # by five to fifteen minutes under load, which a 25-minute freshness window absorbs
  # but a tighter one would not.
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

# poll.py commits watcher_state.json and status.json back after each run.
permissions:
  contents: write

# One run at a time. Note what is NOT here: any in-code concurrency lock. Two separate
# outages in the JI original came from the guard rather than from concurrency — a real
# lock wedged permanently when a run was killed while holding it, and its self-expiring
# replacement then turned away two scheduled runs. Claim-before-send already prevents
# double posting; overlapping runs merely waste effort, while a wedged guard stops
# everything. cancel-in-progress stays false so a run is never killed mid-post.
concurrency:
  group: poll
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt

      # Poll repeatedly inside one job rather than once per trigger.
      #
      # GitHub's `schedule` is throttled on public repos — measured over 29-30 August it
      # fired every two to six hours, not every fifteen minutes — and with a 30-minute
      # publish window, anything appearing between runs is missed outright rather than
      # delayed. Looping means a single sparse trigger still produces a real cadence,
      # with no external pinger and nothing depending on a laptop staying awake.
      #
      # Three hours per invocation: long enough to bridge the observed gaps, well inside
      # the six-hour job ceiling, and short enough that a wedged run frees the concurrency
      # group within one news cycle. Overlapping runs are safe anyway — dedup state is
      # shared through the repo and claimed before sending — and the concurrency group
      # queues a new trigger rather than running it alongside.
      - name: Poll every 5 minutes for ~50 minutes, always on the latest code
        timeout-minutes: 60
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          # Pull before every pass, and keep the loop short.
          #
          # A long loop means a deploy does not take effect until the job ends. On
          # 30 August a bad alert was fixed and pushed within minutes, but a three-hour
          # job carried on running the old code and spammed a live channel for an hour
          # afterwards. Two guards against a repeat: fifty minutes rather than three
          # hours, so a stale job cannot outlive a fix for long, and a hard reset to
          # origin before each pass, so a fix lands within five minutes even mid-run.
          PASSES=10
          for i in $(seq 1 $PASSES); do
            git fetch -q origin main && git reset -q --hard origin/main
            echo "--- pass $i/$PASSES $(date -u +%H:%M:%SZ) code=$(git rev-parse --short HEAD) ---"
            python poll.py || echo "pass $i failed, continuing"
            [ "$i" -lt "$PASSES" ] && sleep 300
          done

      # Runs on failure too: status.json is most useful precisely when the run broke,
      # and it is the only thing that will explain why after the fact.
      - if: always()
        run: python poll.py --status
