name: briefing

on:
  # Manual only. The scheduled editions now ride poll.yml, which fires every 15 minutes
  # from a trigger proven to work.
  #
  # The cron that used to live here fired at 11/17/23 UTC — 7am, 1pm and 7pm Eastern in
  # summer, not the 6/12/6 asked for — and GitHub lagged it by up to two hours, which is
  # how a briefing labelled "Midday" arrived at 3:11pm. Removed rather than corrected:
  # two mechanisms posting to one channel is how a channel gets duplicates.
  workflow_dispatch:

permissions:
  contents: write

# Never two briefings at once. cancel-in-progress stays false so a run is not killed
# mid-post, which would leave the period marked done with nothing delivered.
concurrency:
  group: brief
  cancel-in-progress: false

jobs:
  brief:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt

      # --if-due even on a manual dispatch, so pressing the button outside a window
      # cannot inject an off-schedule edition. Force one locally with `python brief.py`.
      - run: python brief.py --if-due
        env:
          # A separate channel from the newswire, on purpose: the newswire's channel gets
          # stories and nothing else.
          SLACK_BRIEF_WEBHOOK_URL: ${{ secrets.SLACK_BRIEF_WEBHOOK_URL }}
          # Optional. Without it the briefing still posts, selected by ranking alone and
          # saying so in the message.
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
