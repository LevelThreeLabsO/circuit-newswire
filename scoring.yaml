  # ── Conflict economics ─────────────────────────────────────────────────────
  # Hormuz appears in 24 of 269 Circuit headlines. This is not war coverage — it is the
  # economics of a chokepoint: rerouting, war-risk premiums, closed airspace, insurers
  # threatening to cancel. Weighted like an entity because on this beat it is one.
  # 1 point, down from 3. Rerouting and war-risk premiums still tell you something when
  # ADNOC or DP World is in the headline; on their own they are the oil-and-politics
  # stream the desk asked to be rid of.
