# Relevance vocabulary. Data, not logic — poll.py re-reads this every run.
#
# Built from 269 of The Circuit's own story headlines (Feb–Aug 2026), not from guesswork.
# See src/score.py for why the axes are weighted the way they are; the short version is
# that geography is worth 2 and the threshold is 4, so no country term can admit a story
# on its own. Run `python3 poll.py --selftest` after any edit here: it reports recall
# against Circuit's real headlines and the pass rate against a tabloid negative set, so
# a word you add shows its cost as well as its benefit.

default_threshold: 4

# An item must hit at least one of these axes, whatever its score. They are the "is this
# our region at all" test: a Gulf state, a named Gulf company or fund, a named principal.
#
# conflict_econ was an anchor until 2 October 2026 and is not any more. The Circuit desk's
# feedback was blunt: "What I don't need and am primarily getting is stories about oil and
# politics." Measured over the preceding 14 days, 30% of what posted was oil or geopolitics
# and 24% named no company, fund or deal at all — "Hormuz under fire again" was admitting
# itself on the strength of one word. A trade-route story now has to name a company, fund,
# person or place like everything else.
#
# This exists so thresholds can be loosened without admitting global business noise.
# Measured on 48 hours of Bloomberg and Reuters, dropping the bar to 3 without it let in
# "Thailand's Power Giant Sees Revenue Up 15%", "Kioxia, Sandisk Plan $31 Billion Japan
# Memory Chip Expansion" and "Watch How LeBron James Scored $300 Million From Insurers" —
# all of which score on sector plus money and name no part of this region.
require_anchor: [entity, principal, geography]

# Distinct axes the HEADLINE must hit. A place name on its own is a war-and-diplomacy
# story, not a business one, and body text is enough to carry it past the threshold.
min_title_axes: 2
money_points: 1
money_pattern: '\$|\bbillion\b|\bmillion\b|\btrillion\b|\bbn\b|\d+\s?%|\bper cent\b|\bpercent\b'

# The dormant judge seam. Setting this true without implementing one is refused loudly.
judge: false

