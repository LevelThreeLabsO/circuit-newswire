# ── Digest sections ─────────────────────────────────────────────────────────
# Which part of the message a story lands in, decided by the story rather than by its
# source — the same outlet files a data-center deal and a tanker rerouting. Checked in
# order: energy, then tech, then wider-MENA-with-no-Gulf-state, else Gulf business.
categories:
  energy:
    [oil, crude, gas, LNG, OPEC, refinery, pipeline, barrel, barrels, hydrogen, solar,
     renewable, nuclear, power plant, electricity, grid, desalination, tanker, tankers,
     shipping, vessel, vessels, freight, cargo, port, ports, terminal, logistics,
     Hormuz, Red Sea, Suez, reroute, rerouting, war risk, ADNOC, Aramco, QatarEnergy,
     Masdar, ACWA Power, TAQA, DP World, AD Ports, XRG, Borouge, Fertiglobe]
  tech:
    [artificial intelligence, AI, chip, chips, semiconductor, Nvidia, data center,
     data centre, cloud, software, platform, digital, cyber, cybersecurity, crypto,
     blockchain, digital assets, satellite, space, spaceport, biotech, genomics,
     research, science, quantum, robotics, drone, drones, startup, startups, fintech,
     gaming, esports, MGX, G42, Core42, Space42, Presight, Humain, Careem, Talabat]
  wider_mena:
    [Egypt, Egyptian, Cairo, Jordan, Morocco, Iraq, Iraqi, Syria, Syrian, Lebanon,
     Turkey, Türkiye]
  gcc:
    [UAE, Emirates, Emirati, Abu Dhabi, Dubai, Sharjah, Saudi, Riyadh, Jeddah, Qatar,
     Qatari, Doha, Kuwait, Kuwaiti, Bahrain, Oman, Omani, Muscat, GCC, Gulf]

# ── Byline bypass ───────────────────────────────────────────────────────────
# Reporters whose every piece is worth seeing regardless of score. Requires the source
# feed to expose an author (dc:creator or <author>) — many don't. Empty until named.
byline_bypass: []
