# Relevance vocabulary. Data, not logic — poll.py re-reads this every run.
#
# Built from 269 of The Circuit's own story headlines (Feb–Aug 2026), not from guesswork.
# See src/score.py for why the axes are weighted the way they are; the short version is
# that geography is worth 2 and the threshold is 4, so no country term can admit a story
# on its own. Run `python3 poll.py --selftest` after any edit here: it reports recall
# against Circuit's real headlines and the pass rate against a tabloid negative set, so
# a word you add shows its cost as well as its benefit.

default_threshold: 4
money_points: 1
money_pattern: '\$|\bbillion\b|\bmillion\b|\btrillion\b|\bbn\b|\d+\s?%|\bper cent\b|\bpercent\b'

# The dormant judge seam. Setting this true without implementing one is refused loudly.
judge: false

